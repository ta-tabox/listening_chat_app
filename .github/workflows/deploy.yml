name: Deploy to GCP and Firebase

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-northeast1
  FUNCTION_NAME: listening_chat_api

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Workload Identity Federationに必要な権限
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GCP認証（Workload Identity Federation使用）
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      # gcloud CLIのセットアップ
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Cloud Functionsのデプロイ
      - name: Deploy Cloud Functions
        run: |
          cd functions
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --runtime python311 \
            --trigger-http \
            --allow-unauthenticated \
            --region ${{ env.GCP_REGION }} \
            --set-env-vars GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},VERTEX_AI_LOCATION=${{ secrets.VERTEX_AI_LOCATION }},SYSTEM_PROMPT_ID=${{ secrets.SYSTEM_PROMPT_ID }} \
            --entry-point listening_chat_api \
            --max-instances 10 \
            --memory 512MB

      # Node.jsのセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # フロントエンドの依存関係をインストール
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # 本番環境変数を設定してビルド
      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_ENDPOINT: https://${{ env.GCP_REGION }}-${{ secrets.GCP_PROJECT_ID }}.cloudfunctions.net/${{ env.FUNCTION_NAME }}

      # Firebase Hostingへデプロイ
      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }}
